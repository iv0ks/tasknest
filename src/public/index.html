<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tasknest</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true">🪺</span> tasknest</div>
      <div id="who" class="who"></div>
    </header>

    <main class="wrap">
      <section id="login-card" class="card login">
        <h1>Welcome back</h1>
        <p class="muted">One nest per team. Sign in to your organization's board.</p>
        <form id="login-form">
          <label>Username <input name="username" value="alice" autocomplete="username" /></label>
          <label
            >Password
            <input
              name="password"
              type="password"
              value="password123"
              autocomplete="current-password"
          /></label>
          <button type="submit">Sign in</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="board-view" class="hidden">
        <div class="board-head">
          <div>
            <h1 id="org-name"></h1>
            <p class="muted">Your organization's task board.</p>
          </div>
          <button id="logout" class="ghost" type="button">Sign out</button>
        </div>

        <div class="toolbar">
          <form id="new-form" class="inline grow">
            <input name="title" placeholder="New task title" maxlength="120" required />
            <button type="submit">Add task</button>
          </form>
          <form id="open-form" class="inline">
            <input name="id" type="number" min="1" placeholder="Task #" aria-label="Task number" />
            <button type="submit" class="secondary">Open</button>
          </form>
        </div>

        <div id="board" class="board">
          <div class="col" data-status="todo">
            <h2>To do</h2>
            <div class="cards"></div>
          </div>
          <div class="col" data-status="in_progress">
            <h2>In progress</h2>
            <div class="cards"></div>
          </div>
          <div class="col" data-status="done">
            <h2>Done</h2>
            <div class="cards"></div>
          </div>
        </div>

        <div id="viewer"></div>
      </section>
    </main>

    <footer class="foot">tasknest · educational appsec lab · run locally only</footer>

    <script src="/app.js"></script>
  </body>
</html>
